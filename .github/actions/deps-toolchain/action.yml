# Repo-specific toolchain for deps-fixer.yml (dependency program,
# AndyFooBlah/andy-private-docs#57). ci.yml uses it too, so CI and the
# fixer run on the same Node (22, the functions runtime).
name: deps-toolchain
description: Install the toolchain CI uses
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          package-lock.json
          functions/package-lock.json
